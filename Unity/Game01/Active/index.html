<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Parable Shuffle Game</title>
    <style>
      /* Force HTML and Body to be fully transparent and scale to the iframe */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        background-color: rgba(0, 0, 0, 0) !important;
        overflow: hidden;
      }
      
      /* Make the canvas fully transparent and responsive */
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: transparent !important;
        background-color: rgba(0, 0, 0, 0) !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="100%" height="100%" tabindex="-1"></canvas>
    
    <script src="Build/Build.loader.js"></script>
    <script>
      // 1. Force responsive viewport settings from your previous successful build
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      var canvas = document.querySelector("#unity-canvas");

      // 2. Adjust styling dynamically if on mobile
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";
      } else {
        // Desktop responsive override
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      // 3. Initialize the modern Unity instance with clean configuration
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Build.data",
        frameworkUrl: "Build/Build.framework.js",
        codeUrl: "Build/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GuidedJunctionTechnologiesStudio",
        productName: "Parable_Shuffle_Game",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
        console.log("Unity Instance Created Successfully.");
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
